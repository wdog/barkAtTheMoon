<header class="sticky top-0 z-50 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800">
    <nav class="container mx-auto px-4 py-4">
        <div class="flex items-center justify-between">
            <!-- Logo/Brand -->
            <a href="/" class="flex items-center space-x-3">
                {{ if .Site.Params.brand_image }}
                <img src="{{ .Site.Params.brand_image }}" alt="{{ .Site.Params.brand }}" class="h-10 w-10 rounded-full">
                {{ end }}
                <span class="text-xl font-bold text-gray-900 dark:text-white">
                    {{ .Site.Params.brand | default .Site.Title }}
                </span>
            </a>

            <!-- Desktop Navigation -->
            <div class="hidden md:flex items-center space-x-6">
                {{ range .Site.Params.menu }}
                <a href="{{ .URL }}" class="nav-link {{ if eq $.RelPermalink .URL }}nav-link-active{{ end }}">
                    {{ .Name }}
                </a>
                {{ end }}

                <!-- Dark mode toggle -->
                <button id="theme-toggle" type="button"
                    class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
                    aria-label="Toggle dark mode">
                    <!-- Sun icon (shown in dark mode) -->
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path>
                    </svg>
                    <!-- Moon icon (shown in light mode) -->
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </button>
            </div>

            <!-- Mobile menu button -->
            <button id="mobile-menu-toggle" type="button"
                class="md:hidden p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800"
                aria-label="Toggle menu">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>
        </div>

        <!-- Mobile Navigation -->
        <div id="mobile-menu" class="hidden md:hidden mt-4 pb-4 space-y-2">
            {{ range .Site.Params.menu }}
            <a href="{{ .URL }}" class="block py-2 px-4 rounded-lg nav-link {{ if eq $.RelPermalink .URL }}bg-gray-100 dark:bg-gray-800 nav-link-active{{ end }}">
                {{ .Name }}
            </a>
            {{ end }}

            <!-- Dark mode toggle for mobile -->
            <button id="theme-toggle-mobile" type="button"
                class="w-full flex items-center justify-between py-2 px-4 rounded-lg text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800"
                aria-label="Toggle dark mode">
                <span>Dark Mode</span>
                <div class="w-5 h-5">
                    <svg id="theme-icon-mobile" class="w-5 h-5" fill="currentColor" viewBox="0 0 20 20">
                        <path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path>
                    </svg>
                </div>
            </button>
        </div>
    </nav>
</header>
