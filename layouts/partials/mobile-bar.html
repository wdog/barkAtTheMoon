<!-- Mobile Top Bar (only visible on small screens) -->
<div class="lg:hidden fixed top-0 left-0 right-0 z-40 bg-white dark:bg-gray-900 border-b border-gray-200 dark:border-gray-800 shadow-sm">
    <div class="flex items-center justify-between px-4 py-3">
        <!-- Site Name/Brand -->
        <a href="/" class="flex items-center space-x-2">
            {{ if .Site.Params.brand_image }}
            <img src="{{ .Site.Params.brand_image }}" alt="{{ .Site.Params.brand }}" class="h-8 w-8 rounded-full">
            {{ end }}
            <span class="text-lg font-bold text-gray-900 dark:text-white">
                {{ .Site.Params.brand | default .Site.Title }}
            </span>
        </a>

        <!-- Hamburger Menu Button -->
        <button id="mobile-menu-toggle" type="button"
            class="p-2 text-gray-500 hover:text-gray-900 dark:text-gray-400 dark:hover:text-white rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors"
            aria-label="Toggle menu">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
            </svg>
        </button>
    </div>
</div>
