<!DOCTYPE html>
<html lang="{{ .Site.Language.Lang | default "en" }}">
{{ partial "head.html" . }}

<body class="bg-white dark:bg-gray-900">
    {{ if not .IsHome }}
        <!-- Mobile Top Bar -->
        {{ partial "mobile-bar.html" . }}

        <!-- Mobile Overlay -->
        <div id="mobile-overlay" class="lg:hidden hidden fixed inset-0 bg-black bg-opacity-50 z-40"></div>

        <!-- Sidebar -->
        {{ partial "sidebar.html" . }}
    {{ end }}

    <!-- Main Content Area -->
    <main class="{{ if not .IsHome }}lg:ml-72{{ end }} min-h-screen flex items-start justify-center">
        <!-- Centered Content Container -->
        <div class="w-full max-w-6xl px-6 py-8 {{ if not .IsHome }}pt-20 lg:pt-8{{ end }}">
            {{ block "main" . }}{{ end }}
        </div>
    </main>

    <!-- Dark mode toggle script -->
    <script src="{{ "js/darkmode.js" | relURL }}"></script>
</body>
</html>
